<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Anders frei – Sinnwärts</title>

  <!-- Nur globales CSS -->
  <link rel="stylesheet" href="../../style.css" />
</head>

<body>
  <!-- Hero direkt mit Inline-Styles -->
  <section class="af-hero"
    style="
      position: relative;
      width: 100%;
      height: 80vh;
      color: #fff;
      overflow: hidden;
      border-bottom: 1px solid var(--ring);
      background-image: url('../../images/divers-hero-strand.png');
      background-size: cover;
      background-position: 50% 70%;
      filter: brightness(0.7);
    ">
    <div class="hero-text"
      style="
        position: absolute;
        bottom: 20%;
        left: 10%;
        max-width: 600px;
        text-shadow: 0 1px 2px rgba(0,0,0,.45);
      ">
      <h1 style="margin:0 0 .5em;font-size:2.5rem;line-height:1.2;color:var(--accent);">
        Anders. Frei.
      </h1>
      <p style="margin:0;">Ein Raum für Vielfalt, Authentizität und neue Wege.</p>
    </div>
  </section>

  <main class="af-wrap" style="max-width:var(--maxw);margin:40px auto;padding:0 24px;">
    <h2 style="color:var(--accent);margin-bottom:.4em;">Worum es hier geht</h2>
    <p style="margin:.5em 0 1em;">
      Hier entsteht dein Angebot für Menschen, die jenseits von Schubladen leben wollen – klar, respektvoll, wertebasiert.
    </p>
  </main>
</body>
</html>
