<!--?xml version="1.0" encoding="UTF-8"?-->
<svg viewBox="0 0 720 860" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFC94D"></stop><stop offset="100%" stop-color="#DAA520"></stop>
    </linearGradient>
    <style>
      .bg{fill:#0B0F12}
      .ring{fill:none;stroke:url(#gold);stroke-width:14}
      .line{stroke:url(#gold);stroke-linecap:round;stroke-linejoin:round}
      .ink{fill:#F5F2EB}
      .halo{paint-order:stroke fill;stroke:#0B0F12;stroke-width:3;stroke-linejoin:round}
      /* oben &amp; unten identisch, ruhiges Tracking */
      .hd,.cl{font-family:"Playfair Display","Playfair Display SC",serif;font-weight:700;font-size:42px;letter-spacing:5px}
      .clm{font-family:"Inter",-apple-system,system-ui,"Segoe UI",Roboto,Arial,sans-serif;font-weight:600;letter-spacing:2.2px;font-size:28px}
      .innerRing{stroke-width:7;opacity:.82}
      text{text-rendering:geometricPrecision}
    </style>
    <path id="arcTop" d="M80,360 A280,280 0 0 0 640,360"></path>
    <path id="arcBot" d="M80,360 A280,280 0 0 1 640,360"></path>
  </defs>

  <rect class="bg" width="100%" height="100%"></rect>
  <circle cx="360" cy="360" r="240" class="ring"></circle>

  <g transform="translate(360 360)">
    <circle r="128" class="ring innerRing"></circle>
    <g class="line" fill="none" stroke-width="8">
      <path d="M0,-118 18,-12 118,0 18,12 0,118 -18,12 -118,0 -18,-12 Z"></path>
    </g>
    <path d="M0,-140 26,0 0,140 -26,0 Z" fill="none" stroke="#B34700" stroke-width="8"></path>
    <path d="M0,-90 16,0 0,90 -16,0 Z" fill="none" stroke="#F5F2EB" stroke-width="6" opacity=".92"></path>
    <circle r="6" fill="url(#gold)"></circle>
  </g>

  <!-- beide gleich groß -->
  <text class="ink hd halo">
    <textPath href="#arcTop" startOffset="50%" text-anchor="middle" dy="-6">KRÜGERS KLARHEITSKOMPASS</textPath>
  </text>
  <text class="ink cl halo">
    <textPath href="#arcBot" startOffset="50%" text-anchor="middle" dy="34">SINNWÄRTS · STUDIO</textPath>
  </text>

  <g transform="translate(360,745)" text-anchor="middle" class="ink clm halo">
    <text y="0">SUCHT SUCHT SINN.</text>
    <text y="36">KLARHEIT FINDET RICHTUNG.</text>
  </g>
</svg>
