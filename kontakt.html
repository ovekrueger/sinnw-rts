  <link rel="stylesheet" href="style.css" />
</head>
<body>

<!-- NAV -->
<header class="site-header">
  <div class="nav-container">
    <a class="brand" href="index.html">Sinnwärts</a>
    <nav aria-label="Hauptnavigation">
      <ul class="nav-list">
        <li><a href="index.html">Start</a></li>
        <li><a href="ueber-mich.html">Über mich</a></li>

        <li><a href="kontakt.html" class="active">Kontakt</a></li>
      </ul>
    </nav>
  </div>
</header>

<!-- HERO -->
<section class="hero hero-kontakt">
  <img src="images/hero-sucht-sucht-sinn.jpg" alt="Kontakt – Sinnwärts" class="hero-bg" />
  <div class="inner">
    <h1>Kontakt</h1>
    <p class="sub">Klarheit beginnt mit einem Gespräch.</p>
  </div>
</section>

<!-- Inhalt -->
<section class="wrap block">
  <h2>So erreichst du mich</h2>
  <p><strong>E-Mail:</strong> <a href="mailto:hello@ovekrueger.de">hello@ovekrueger.de</a></p>
  <p><strong>Ort:</strong> Hamburg · Online & vor Ort</p>
</section>

<section class="wrap block">
  <h2>Deine Nachricht</h2>
  <form action="https://formspree.io/f/your-id" method="POST" class="grid-2">
    <div>
      <label for="name">Name</label><br>
      <input id="name" name="name" type="text" required style="width:100%;padding:10px;border-radius:10px;border:1px solid var(--ring);background:#0e1216;color:var(--ink)">
    </div>
    <div>
      <label for="email">E-Mail</label><br>
      <input id="email" name="email" type="email" required style="width:100%;padding:10px;border-radius:10px;border:1px solid var(--ring);background:#0e1216;color:var(--ink)">
    </div>
    <div style="grid-column:1/-1">
      <label for="msg">Nachricht</label><br>
      <textarea id="msg" name="message" rows="6" required style="width:100%;padding:10px;border-radius:10px;border:1px solid var(--ring);background:#0e1216;color:var(--ink)"></textarea>
    </div>
    <div style="grid-column:1/-1">
      <button class="btn" type="submit">Senden</button>
    </div>
  </form>
</section>

<footer class="site-footer">
  <div class="wrap"><small>© <span id="y"></span> Ove Krüger · Sinnwärts</small></div>
</footer>
<script>document.getElementById('y').textContent=new Date().getFullYear();</script>
</body>
</html>
