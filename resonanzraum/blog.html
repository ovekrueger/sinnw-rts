<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Resonanzraum – Blog-Archiv | Sinnwärts Studio</title>
  <meta name="description" content="Alle Beiträge aus dem Resonanzraum: ruhig, klar, integral.">
  <link rel="canonical" href="/sinnw-rts/resonanzraum/blog.html">
  <link rel="stylesheet" href="/sinnw-rts/style.css">
  <style>
    .wrap{max-width:1100px;margin:32px auto;padding:0 16px}
    .grid{display:grid;gap:24px;grid-template-columns:repeat(auto-fill,minmax(280px,1fr))}
    .card{background:#0B0F12;border:1px solid #222;border-radius:14px;overflow:hidden}
    .card img{width:100%;aspect-ratio:16/9;object-fit:cover}
    .card .inner{padding:14px 16px}
    .meta{font-size:.9rem;opacity:.8}
  </style>
</head>
<body class="resonanzraum">
<header class="site-header"><a class="brand" href="/sinnw-rts/index.html">Sinnwärts Studio</a></header>

<main class="wrap">
  <h1>Resonanzraum</h1>
  <p class="sub">Weniger Rauschen. Mehr Richtung.</p>

  <div id="grid" class="grid" aria-live="polite"></div>
  <p id="status" class="meta" role="status" style="margin-top:16px;"></p>

  <noscript><p style="color:#f66">JavaScript ist deaktiviert – das Archiv kann so nicht geladen werden.</p></noscript>
</main>

<script>
(function(){
  var status = document.getElementById('status');
  var grid   = document.getElementById('grid');

  function cacheBust(url){
    return url + (url.indexOf('?')>-1 ? '&' : '?') + 'v=' + Date.now();
  }
  function loadJson(url, cb, eb){
    var xhr = new XMLHttpRequest();
    xhr.open('GET', cacheBust(url), true);
    xhr.responseType = 'json';
    xhr.onload = function(){
      if(xhr.status >= 200 && xhr.status < 300){
        cb(xhr.response || JSON.parse(xhr.responseText));
      } else {
        eb(new Error('HTTP ' + xhr.status + ' for ' + url));
      }
    };
    xhr.onerror = function(){ eb(new Error('Network error for ' + url)); };
    xhr.send();
  }

  try {
    // Repo-Prefix automatisch erkennen (z.B. "/sinnw-rts")
    
var POSTS_URL = prefix + '/resonanzraum/blog/posts.json';
    var POSTS_URL = prefix + '/resonanzraum/blog/posts.json';

    loadJson(POSTS_URL, function(posts){
      // sort: newest first
      posts.sort(function(a,b){
        var da = (a.date||'');
        var db = (b.date||'');
        return db.localeCompare(da);
      });

      var html = '';
      for(var i=0;i<posts.length;i++){
        var p = posts[i];
        var img = (p.img && p.img.charAt(0) === '/')
          ? prefix + p.img
          : prefix + '/images/blog/' + (p.img || '');
        var href = prefix + '/resonanzraum/blog/' + p.slug + '.html';

        html += ''
          + '<article class="card">'
          +   '<a href="' + href + '" aria-label="' + (p.title||'Beitrag') + '">'
          +     '<img src="' + img + '" alt="">'
          +     '<div class="inner">'
          +       '<div class="meta">' + (p.date||'') + ' · ' + (p.read||'') + ' min · ' + (p.cat||'Resonanzraum') + '</div>'
          +       '<h3>' + (p.title||'') + '</h3>'
          +       '<p>' + (p.teaser||'') + '</p>'
          +     '</div>'
          +   '</a>'
          + '</article>';
      }

      grid.innerHTML = html;
      status.textContent = posts.length ? (posts.length + ' Beitrag·e geladen.') : 'Noch keine Beiträge.';
    }, function(err){
      status.textContent = 'Fehler beim Laden der Beiträge.';
      console.error(err);
    });

  } catch(e){
    status.textContent = 'Fehler beim Laden der Beiträge.';
    console.error(e);
  }
})();
</script>
</body>
</html>
