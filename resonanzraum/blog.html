<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Resonanzraum – Blog-Archiv | Sinnwärts Studio</title>
  <meta name="description" content="Alle Blog-Beiträge aus dem Resonanzraum. Teaser, Kategorien, Suche und Archiv.">
  <link rel="canonical" href="https://sinnwaerts-studio.de/resonanzraum/blog.html">
  <meta name="robots" content="index,follow">

  <!-- CSS -->
  <link rel="preload" href="/style.css" as="style">
  <link rel="stylesheet" href="/style.css">

  <!-- JSON-LD: CollectionPage -->
  <script type="application/ld+json">
  {
    "@context":"https://schema.org",
    "@type":"CollectionPage",
    "url":"https://sinnwaerts-studio.de/resonanzraum/blog.html",
    "name":"Blog-Archiv"
  }
  </script>

  <!-- JSON-LD: Breadcrumbs -->
  <script type="application/ld+json">
  {
    "@context":"https://schema.org",
    "@type":"BreadcrumbList",
    "itemListElement":[
      {"@type":"ListItem","position":1,"name":"Start","item":"https://sinnwaerts-studio.de/"},
      {"@type":"ListItem","position":2,"name":"Resonanzraum","item":"https://sinnwaerts-studio.de/resonanzraum.html"},
      {"@type":"ListItem","position":3,"name":"Blog-Archiv","item":"https://sinnwaerts-studio.de/resonanzraum/blog.html"}
    ]
  }
  </script>

  <style>
    /* kleine Hilfs-Styles, falls style.css nicht alles abdeckt */
    .wrap{max-width:1100px;margin:0 auto;padding:0 16px}
    .block{margin:40px 0}
    .breadcrumb{display:flex;gap:.5rem;align-items:center;color:var(--muted)}
    .breadcrumb a{color:var(--text-soft);text-decoration:none}
    .lead{color:var(--text-soft);max-width:60ch}
    .toolbar{display:flex;gap:.75rem;flex-wrap:wrap;align-items:center}
    .toolbar input[type="search"], .toolbar select{
      background:var(--bg-soft); border:1px solid var(--card); color:var(--text);
      padding:.6rem .8rem; border-radius:.75rem; min-width:16rem
    }
    .cards{display:grid;gap:20px;grid-template-columns:repeat(auto-fill,minmax(280px,1fr))}
    .card{background:var(--bg-soft);border:1px solid var(--card);border-radius:14px;overflow:hidden}
    .card a{display:block;text-decoration:none;color:inherit}
    .card-media{margin:0;overflow:hidden;background:var(--card)}
    .card-media img{display:block;width:100%;height:auto}
    .card-hd{padding:16px 16px 0}
    .card-hd h3{margin:.25rem 0}
    .card-txt{padding:8px 16px 0;color:var(--text-soft)}
    .card-cta{display:inline-block;margin:12px 16px 16px}
    .meta{color:var(--muted);font-size:.9rem}
    .visually-hidden{position:absolute!important;height:1px;width:1px;overflow:hidden;clip:rect(1px,1px,1px,1px);white-space:nowrap}
  </style>
</head>
<body id="top" class="blog">

  <!-- Header -->
  <header class="wrap block">
    <nav aria-label="Brotkrumen" class="breadcrumb">
      <a href="/resonanzraum.html">Resonanzraum</a><span aria-hidden="true">›</span>
      <strong>Blog-Archiv</strong>
    </nav>
    <p class="eyebrow">VERTIEFUNG</p>
    <h1>Alle Blog-Beiträge</h1>
    <p class="lead">Gedanken, Neuro-Basics und Stories aus der Praxis. Mehr Substanz, weniger Buzzwords.</p>
  </header>

  <!-- Suche / Filter (platzhalter) -->
  <section class="wrap block" aria-labelledby="filter-hd">
    <h2 id="filter-hd" class="visually-hidden">Suche & Filter</h2>
    <form class="toolbar" role="search" onsubmit="return false">
      <label for="q" class="visually-hidden">Suche</label>
      <input id="q" name="q" type="search" placeholder="Beiträge durchsuchen …" autocomplete="off" />
      <label for="cat" class="visually-hidden">Kategorie</label>
      <select id="cat" name="cat">
        <option value="">Alle Kategorien</option>
        <option value="sucht">Sucht & Selbstwirksamkeit</option>
        <option value="kompass">Klarheitskompass</option>
        <option value="neuro">Neuro-Basics</option>
        <option value="stories">Stories</option>
      </select>
      <button class="btn btn-gold" type="submit">Filtern</button>
    </form>
  </section>

  <!-- Archiv-Grid -->
  <main class="wrap block" aria-labelledby="archive-hd">
    <h2 id="archive-hd" class="visually-hidden">Archiv</h2>
    <ul class="cards post-grid" aria-live="polite"></ul>

    <div class="btn-row" style="display:flex;gap:12px;justify-content:center;margin-top:32px">
      <a class="btn" href="../resonanzraum.html">Zurück zum Resonanzraum</a>
      <a class="btn btn-gold" href="#top">Nach oben</a>
    </div>
  </main>

  <!-- Script: lädt /resonanzraum/blog/posts.json -->
 <script>
(async () => {
  const ul = document.querySelector('.post-grid');
  try {
    const resp = await fetch('posts.json'); // liegt im gleichen Verzeichnis
    if (!resp.ok) throw new Error('posts.json not found: ' + resp.status);
    const posts = await resp.json();

    // neueste zuerst
    posts.sort((a, b) => new Date(b.date) - new Date(a.date));

    // Karten-HTML generieren
    ul.innerHTML = posts.map(p => `
      <li class="card">
        <article>
          <a class="card-link" href="${p.slug}.html" aria-label="${p.title}">
            <figure class="card-media">
              ${
                p.img
                  ? `<picture>
                       <source srcset="images/${p.img.replace('.jpg','')}.webp" type="image/webp">
                       <img src="images/${p.img}" alt="${p.title}" width="960" height="540" loading="lazy" decoding="async">
                     </picture>`
                  : `<div class="placeholder" style="aspect-ratio:16/9;display:grid;place-items:center;">${p.title}</div>`
              }
            </figure>
            <header class="card-hd">
              <p class="eyebrow">${p.cat || ''}</p>
              <h3>${p.title}</h3>
              <p class="meta">
                <time datetime="${p.date}">${new Date(p.date).toLocaleDateString('de-DE')}</time>
                ${p.read ? ` · ${p.read} Min` : ''}
              </p>
            </header>
            <p class="card-txt">${p.teaser || ''}</p>
            <span class="card-cta btn">Lesen</span>
          </a>
        </article>
      </li>
    `).join('');
  } catch (e) {
    console.error(e);
    ul.innerHTML = '<li class="card"><p>Fehler beim Laden der Beiträge.</p></li>';
  }
})();
</script>
</body>
</html>
