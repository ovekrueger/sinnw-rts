<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Resonanzraum – Blog-Archiv | Sinnwärts Studio</title>
  <meta name="description" content="Alle Beiträge aus dem Resonanzraum: ruhig, klar, integral.">
  <link rel="canonical" href="/sinnw-rts/resonanzraum/blog.html">
  <link rel="stylesheet" href="/sinnw-rts/style.css">
  <style>
    .wrap{max-width:1100px;margin:32px auto;padding:0 16px}
    .grid{display:grid;gap:24px;grid-template-columns:repeat(auto-fill,minmax(280px,1fr))}
    .card{background:#0B0F12;border:1px solid #222;border-radius:14px;overflow:hidden}
    .card img{width:100%;aspect-ratio:16/9;object-fit:cover}
    .card .inner{padding:14px 16px}
    .meta{font-size:.9rem;opacity:.8}
  </style>
</head>
<body class="resonanzraum">
<header class="site-header"><a class="brand" href="/sinnw-rts/index.html">Sinnwärts Studio</a></header>

<main class="wrap">
  <h1>Resonanzraum</h1>
  <p class="sub">Weniger Rauschen. Mehr Richtung.</p>

  <div id="grid" class="grid" aria-live="polite"></div>
  <p id="status" class="meta" role="status" style="margin-top:16px;"></p>

  <noscript><p style="color:#f66">JavaScript ist deaktiviert – das Archiv kann so nicht geladen werden.</p></noscript>
</main>

<script>
(function(){
  var status = document.getElementById('status');
  var grid   = document.getElementById('grid');

  function bust(u){ return u + (u.indexOf('?')>-1?'&':'?') + 'v=' + Date.now(); }
  function get(url){ return new Promise(function(ok,err){
    var x=new XMLHttpRequest();
    x.open('GET', bust(url), true);
    x.responseType='json';
    x.onload=function(){ (x.status>=200 && x.status<300) ? ok(x.response||JSON.parse(x.responseText)) : err(new Error(x.status+' '+url)); };
    x.onerror=function(){ err(new Error('net '+url)); };
    x.send();
  });}

  // Kandidaten: absolut (mit Repo-Prefix), absolut (ohne), relativ
  var CANDIDATES = [
    '/sinnw-rts/resonanzraum/blog/posts.json',
    '/resonanzraum/blog/posts.json',
    './blog/posts.json'
  ];

  (async function load(){
    try {
      // nacheinander probieren
      var posts, lastErr;
      for (var i=0;i<CANDIDATES.length;i++){
        try { posts = await get(CANDIDATES[i]); break; }
        catch(e){ lastErr = e; }
      }
      if(!posts) throw lastErr || new Error('no posts.json found');

      // sortieren und rendern
      posts.sort(function(a,b){ return (b.date||'').localeCompare(a.date||''); });

      var html='';
      for (var i=0;i<posts.length;i++){
        var p = posts[i];
        var prefix = '/sinnw-rts';
        var img = (p.img && p.img.charAt(0)==='/') ? prefix + p.img : prefix + '/images/blog/' + (p.img||'');
        var href = prefix + '/resonanzraum/blog/' + p.slug + '.html';
        html += ''
          + '<article class="card">'
          +   '<a href="'+href+'" aria-label="'+(p.title||'Beitrag')+'">'
          +     '<img src="'+img+'" alt="">'
          +     '<div class="inner">'
          +       '<div class="meta">'+(p.date||'')+' · '+(p.read||'')+' min · '+(p.cat||'Resonanzraum')+'</div>'
          +       '<h3>'+(p.title||'')+'</h3>'
          +       '<p>'+(p.teaser||'')+'</p>'
          +     '</div>'
          +   '</a>'
          + '</article>';
      }
      grid.innerHTML = html;
      status.textContent = posts.length ? (posts.length+' Beitrag·e geladen.') : 'Noch keine Beiträge.';
    } catch(e){
      status.textContent = 'Fehler beim Laden der Beiträge.';
      console.error('posts.json loader:', e);
    }
  })();
})();
</script>
</body>
</html>
