
<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Resonanzraum – Blog-Archiv | Sinnwärts Studio</title>
  <link rel="stylesheet" href="../style.css">
  <style>
    .wrap{max-width:1100px;margin:32px auto;padding:0 16px}
    .grid{display:grid;gap:24px;grid-template-columns:repeat(auto-fill,minmax(280px,1fr))}
    .card{background:#0B0F12;border:1px solid #222;border-radius:14px;overflow:hidden}
    .card img{width:100%;aspect-ratio:16/9;object-fit:cover}
    .card .inner{padding:14px 16px}
    .meta{font-size:.9rem;opacity:.8}
  </style>
</head>
<body class="resonanzraum">
<header class="site-header"><a class="brand" href="../index.html">Sinnwärts Studio</a></header>

<main class="wrap">
  <h1>Resonanzraum</h1>
  <p class="sub">Weniger Rauschen. Mehr Richtung.</p>

  <div id="grid" class="grid" aria-live="polite"></div>
  <p id="status" class="meta" role="status" style="margin-top:16px;"></p>
</main>

<script>
// 1) JSON relativ zur blog.html (liegt in /resonanzraum/)
const DATA_URL = 'blog/posts.json';

fetch(DATA_URL)
  .then(r => r.json())
  .then(posts => {
    const list = document.querySelector('#posts');
    list.innerHTML = posts.map(p => `
      <article class="post">
        <a class="post-link" href="blog/${p.slug}.html">
          <img class="post-img" src="${p.img}" alt="${p.title}" loading="lazy">
          <h3>${p.title}</h3>
          <p class="meta">${p.date} · ca. ${p.read} Min</p>
          <p class="teaser">${p.teaser}</p>
        </a>
      </article>
    `).join('');
  })
  .catch(err => {
    console.error('Blog fetch error:', err);
    document.querySelector('#posts').innerHTML =
      '<p class="warn">Beiträge konnten nicht geladen werden.</p>';
  });
</script>
</body>
</html>
