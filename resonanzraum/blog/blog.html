<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Resonanzraum – Blog-Archiv | Sinnwärts Studio</title>

  <!-- Pfade: blog.html liegt in /resonanzraum/blog/  → CSS im Root = ../../style.css -->
  <link rel="stylesheet" href="../../style.css">

  <style>
    body{background:#0B0F12;color:#eee;font-family:"Montserrat",sans-serif}
    .wrap{max-width:1100px;margin:32px auto;padding:0 16px}
    h1{color:#fff;margin-bottom:.25em}
    .sub{opacity:.8;margin-bottom:1.5em}

    .grid{display:grid;gap:28px;grid-template-columns:repeat(auto-fill,minmax(320px,1fr))}
    .card{
      background:#111418;border:1px solid #2a2d31;border-radius:16px;overflow:hidden;
      box-shadow:0 2px 6px rgba(0,0,0,.3);transition:transform .2s, box-shadow .2s;
    }
    .card:hover{transform:translateY(-4px);box-shadow:0 4px 10px rgba(0,0,0,.4)}
    .card img{width:100%;aspect-ratio:16/9;object-fit:cover;opacity:.9}
    .card .inner{display:block;padding:18px 20px;text-decoration:none;color:inherit}
    .card h3{color:#FFC94D;margin:.2em 0 .4em;font-weight:600;font-size:1.1rem;line-height:1.3}
    .card .meta{font-size:.9rem;opacity:.75;margin-bottom:.6em}
    .card .teaser{font-size:.95rem;color:#ddd;line-height:1.4}
    .meta{font-size:.9rem;opacity:.8}
  </style>
</head>

<body class="resonanzraum">
  <!-- Pfad zur Startseite im Root → ../../index.html -->
  <header class="site-header">
    <a class="brand" href="../../index.html">Sinnwärts Studio</a>
  </header>

  <main class="wrap">
    <h1>Resonanzraum</h1>
    <p class="sub">Weniger Rauschen. Mehr Richtung.</p>

    <div id="grid" class="grid" aria-live="polite"></div>
    <p id="status" class="meta" role="status" style="margin-top:16px;"></p>
  </main>

  <script>
  (function(){
    var statusEl = document.getElementById('status');
    function setStatus(msg){ if(statusEl){ statusEl.textContent = msg; } }

    // posts.json liegt im selben Ordner wie diese Datei
    var DATA_URL = 'posts.json?v=' + Date.now();

    fetch(DATA_URL)
      .then(function(r){
        if(!r.ok) throw new Error('HTTP '+r.status+' ('+DATA_URL+')');
        return r.json();
      })
      .then(function(posts){
        if(!Array.isArray(posts)) throw new Error('Ungültiges JSON (Array erwartet).');

        posts.sort(function(a,b){ return String(b.date).localeCompare(String(a.date)); });

        var html = posts.map(function(p){
          var slug   = String(p.slug||'').trim();
          var title  = String(p.title||'Ohne Titel');
          var date   = String(p.date||'');
          var read   = String(p.read||'');
          var teaser = String(p.teaser||'');
          var img    = String(p.img||'');

          return (
            '<article class="card">'+
              '<a class="inner" href="'+ slug +'.html">'+
                (img ? '<img src="'+ img +'" alt="'+ title.replace(/"/g,'&quot;') +'" loading="lazy">' : '')+
                '<h3>'+ title +'</h3>'+
                '<p class="meta">'+ (date?date+' · ':'') + (read?('ca. '+read+' Min'):'') +'</p>'+
                (teaser ? '<p class="teaser">'+ teaser +'</p>' : '')+
              '</a>'+
            '</article>'
          );
        }).join('');

        document.getElementById('grid').innerHTML = html || '<p class="meta">Noch keine Beiträge.</p>';
        setStatus(posts.length + ' Beitrag' + (posts.length===1?'':'e') + ' geladen.');
      })
      .catch(function(err){
        console.error('Blog fetch error:', err);
        setStatus('Fehler beim Laden: ' + err.message);
      });
  })();
  </script>
</body>
</html>
