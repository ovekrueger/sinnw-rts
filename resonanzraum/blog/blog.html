<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Resonanzraum – Blog-Archiv | Sinnwärts Studio</title>

  <!-- Pfade: blog.html liegt in /resonanzraum/blog/  → CSS im Root = ../../style.css -->
  <link rel="stylesheet" href="../../style.css">

 
</head>

<body class="resonanzraum">
  <!-- Pfad zur Startseite im Root → ../../index.html -->
  
  <header class="site-header">
  <div class="nav-container">
    <a class="brand" href="../../index.html">Sinnwärts Studio</a>

    <button class="menu-toggle" aria-label="Menü öffnen" aria-expanded="false">
      ☰
    </button>

    <nav aria-label="Hauptnavigation">
      <ul class="nav-list">
        <li><a href="../../index.html">Start</a></li>
        <li><a href="../../ueber-mich.html">Über mich</a></li>
        <li><a href="../../angebot.html">Angebote</a></li>
        <li><a class="active" aria-current="page" href="../../resonanzraum.html">Resonanzraum</a></li>
        <li><a href="../../kontakt.html">Kontakt</a></li>
      </ul>
    </nav>
  </div>
</header>
  
<!-- Hero-Header -->
<!-- Hero-Header -->
<header class="blog-hero" role="banner" aria-label="Headerbild Resonanzraum">
  <img
    src="../../images/integrale-lebenspr.jpg"
    alt="Integrale Lebenspraxis – Figur auf farbiger Fläche, Kontinuum, Do your best"
    loading="eager" fetchpriority="high" decoding="async">
</header>
  <main class="wrap">
    <p class="kicker">Resonanzraum</p>
    <p class="sub">Weniger Rauschen. Mehr Richtung.</p>

    <div id="grid" class="grid" aria-live="polite"></div>
    <p id="status" class="meta" role="status" style="margin-top:16px;"></p>
  </main>

  <script>
  (function(){
    var statusEl = document.getElementById('status');
    function setStatus(msg){ if(statusEl){ statusEl.textContent = msg; } }

    // posts.json liegt im selben Ordner wie diese Datei
    var DATA_URL = 'posts.json?v=' + Date.now();

    fetch(DATA_URL)
      .then(function(r){
        if(!r.ok) throw new Error('HTTP '+r.status+' ('+DATA_URL+')');
        return r.json();
      })
      .then(function(posts){
        if(!Array.isArray(posts)) throw new Error('Ungültiges JSON (Array erwartet).');

        posts.sort(function(a,b){ return String(b.date).localeCompare(String(a.date)); });

       var html = posts.map(function(p){
  var slug   = String(p.slug||'').trim();
  var title  = String(p.title||'Ohne Titel');
  var date   = String(p.date||'');
  var read   = String(p.read||'');
  var teaser = String(p.teaser||'');
  var img    = String(p.img||'');      // kann leer sein
  var cls    = 'card' + (img ? '' : ' no-img');

  return (
    '<article class="'+cls+'">'+
      '<a class="inner" href="'+ slug +'.html">'+
        (img ? '<img src="'+ img +'" alt="'+ title.replace(/"/g,'&quot;') +'" loading="lazy">' : '')+
        '<h3>'+ title +'</h3>'+
        '<p class="meta">'+ (date?date+' · ':'') + (read?('ca. '+read+' Min'):'') +'</p>'+
        (teaser ? '<p class="teaser">'+ teaser +'</p>' : '')+
      '</a>'+
    '</article>'
  );
}).join('');

        document.getElementById('grid').innerHTML = html || '<p class="meta">Noch keine Beiträge.</p>';
        setStatus(posts.length + ' Beitrag' + (posts.length===1?'':'e') + ' geladen.');
      })
      .catch(function(err){
        console.error('Blog fetch error:', err);
        setStatus('Fehler beim Laden: ' + err.message);
      });
  })();
  </script>
</body>
</html>
