<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Resonanzraum – Blog-Archiv | Sinnwärts Studio</title>
  <meta name="description" content="Archiv aller Blog-Beiträge im Resonanzraum von Ove Krüger – Sinnwärts Studio." />

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" crossorigin>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">

  <!-- Preload Hero -->
  <link rel="preload" as="image" href="/images/integrale-lebenspr.png" />

  <!-- Selbstenthaltener Stil (keine Abhängigkeit von ../../style.css) -->
  <style>
    :root{
      --bg:#0b0f12;
      --card:#14181c;
      --text:#eaeff3;
      --muted:#9aa4ae;
      --gold:#ffc94d;
      --border:rgba(255,255,255,.08);
      --radius:16px;
      --wrap:1100px;
    }
    *{box-sizing:border-box}
    html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font:16px/1.6 Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}

    /* Header / Nav */
    .rr-header{position:sticky;top:0;z-index:1000;background:var(--bg);border-bottom:1px solid var(--border)}
    .rr-nav{max-width:var(--wrap);margin:0 auto;display:flex;align-items:center;gap:16px;padding:12px 16px}
    .rr-brand{color:var(--gold);text-decoration:none;font-weight:700;letter-spacing:.02em}
    .rr-menu{list-style:none;display:flex;gap:18px;margin:0 0 0 auto;padding:0}
    .rr-menu a{color:var(--text);text-decoration:none;opacity:.9}
    .rr-menu a[aria-current="page"], .rr-menu a:hover{opacity:1;text-decoration:underline;text-underline-offset:4px}
    @media (max-width:760px){ .rr-menu{gap:12px;font-size:.95rem} }

    /* Layout */
    .rr-wrap{max-width:var(--wrap);margin:0 auto;padding:0 16px}
    .rr-block{margin:24px 0}

    /* Bild-Hero ohne Beschnitt */
    .rr-hero{
      max-width:var(--wrap);
      margin:16px auto 8px;
      border-radius:12px;
      overflow:hidden; /* Rundung clippt das Bild */
    }
    .rr-hero img{
      display:block;
      width:100%;
      height:auto;     /* volle Breite, variable Höhe */
    }

    /* Button */
    .rr-btn{display:inline-flex;align-items:center;gap:.5rem;padding:.5rem .75rem;border:1.5px solid var(--gold);color:var(--gold);border-radius:10px;text-decoration:none}

    /* Grid Karten */
    .rr-grid{display:grid;gap:24px;grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}
    .rr-card{border-radius:var(--radius);background:var(--card);border:1px solid var(--border)}
    .rr-card .inner{display:block;padding:18px 18px 20px;text-decoration:none;color:inherit}
    .rr-card h3{margin:12px 0 6px}
    .rr-meta{opacity:.75}
    .rr-teaser{opacity:.92}

    /* To-top */
    .rr-top{position:fixed;right:16px;bottom:16px;display:none;place-items:center;width:40px;height:40px;border-radius:999px;border:1px solid var(--border);color:var(--text);text-decoration:none}
    .rr-top.show{display:grid}
  </style>
</head>

<body class="resonanzraum">
  <!-- HEADER -->
  <header class="rr-header">
    <div class="rr-nav">
      <a class="rr-brand" href="/index.html">SINNWÄRTS STUDIO</a>
      <ul class="rr-menu" aria-label="Hauptnavigation">
        <li><a href="/index.html">Start</a></li>
        <li><a href="/ueber-mich.html">Über mich</a></li>
        <li><a href="/angebot.html">Angebote</a></li>
        <li><a href="/resonanzraum.html" aria-current="page">Resonanzraum</a></li>
        <li><a href="/kontakt.html">Kontakt</a></li>
      </ul>
    </div>
  </header>

  <!-- HERO (img, kein Beschnitt) -->
  <div class="rr-hero">
    <img src="/images/integrale-lebenspr.png" alt="Resonanzraum – Blog-Header">
  </div>

  <!-- INHALT -->
  <main class="rr-wrap rr-block">
    <div style="margin:.5rem 0 1rem">
      <a class="rr-btn" href="/resonanzraum.html">← Zurück zum Resonanzraum</a>
    </div>

    <section class="rr-block" aria-labelledby="blog-hd">
      <p id="status" class="rr-meta" style="margin:.5rem 0 1rem">Lade Beiträge …</p>
      <div id="grid" class="rr-grid" role="list"></div>
    </section>
  </main>

  <!-- TO TOP -->
  <a class="rr-top" id="toTop" href="#top" aria-label="Nach oben" title="Nach oben">↑</a>

  <!-- FOOTER -->
  <footer class="rr-wrap rr-block" style="text-align:center;opacity:.85;padding:2rem 0">
    <small>© <span id="y"></span> Ove Krüger · Sinnwärts Studio</small>
  </footer>

<script>
  // Blogposts laden – JSON liegt unter /resonanzraum/blog/posts.json
  (function(){
    const status=document.getElementById('status');
    const grid=document.getElementById('grid');
    const setStatus=m=>status.textContent=m;

    const url = '/resonanzraum/blog/posts.json?v=' + Date.now();
    fetch(url)
      .then(r=>{ if(!r.ok) throw new Error('HTTP '+r.status); return r.json(); })
      .then(posts=>{
        if(!Array.isArray(posts)) throw new Error('Ungültiges JSON.');
        posts.sort((a,b)=>String(b.date).localeCompare(String(a.date)));
        grid.innerHTML = posts.map(p=>{
          const slug  = p.slug   || '';
          const title = p.title  || 'Ohne Titel';
          const date  = p.date   || '';
          const read  = p.read   || '';
          const teaser= p.teaser || '';
          return `
            <article class="rr-card" role="listitem">
              <a class="inner" href="/resonanzraum/blog/${slug}.html">
                <h3>${title}</h3>
                <p class="rr-meta">${date}${read?' · ca. '+read+' Min':''}</p>
                <p class="rr-teaser">${teaser}</p>
              </a>
            </article>`;
        }).join('');
        setStatus(posts.length+' Beiträge geladen.');
      })
      .catch(err=>{
        console.error(err);
        setStatus('Fehler beim Laden: '+err.message);
      });
  })();
</script>
</body>
</html>
