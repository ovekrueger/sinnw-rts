<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Resonanzraum – Blog-Archiv | Sinnwärts Studio</title>

  <!-- Basis-Styles -->
  <link rel="stylesheet" href="../../style.css" />

  <!-- Lokale Ergänzungen -->
  <style>
    .wrap{max-width:1100px;margin:0 auto;padding:0 16px}

    /* Karten */
    .grid{display:grid;gap:24px;grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}
    .card{border-radius:16px;background:#14181c;border:1px solid rgba(255,255,255,.08)}
    .card.no-img .inner{display:block;padding:18px 18px 20px}
    .card img{display:block;width:100%;height:auto;border-radius:16px 16px 0 0}
    .card h3{margin:12px 0 6px}
    .meta{opacity:.7}

    /* Header/Nav */
    .site-header{position:sticky;top:0;background:#0b0f12;color:#fff;z-index:1000}
    .nav-container{max-width:1100px;margin:0 auto;display:flex;align-items:center;gap:16px;padding:10px 16px}
    .brand{color:#ffc94d;text-decoration:none;font-weight:600}
    .nav-list{list-style:none;display:flex;gap:16px;margin:0;padding:0}
    .nav-list a{color:#fff;text-decoration:none;opacity:.9}
    .nav-list a:hover,.nav-list a.active{opacity:1;text-underline-offset:4px;text-decoration:underline}
    .menu-toggle{display:none;background:none;border:0;color:#fff;font-size:1.4rem;line-height:1}
    @media (max-width:800px){
      .menu-toggle{display:block;margin-left:auto}
      nav[aria-label="Hauptnavigation"]{position:relative}
      .nav-list{
        display:none;flex-direction:column;gap:12px;background:#0b0f12;
        position:absolute;left:0;right:0;top:42px;padding:12px 16px;
        border-bottom:1px solid rgba(255,255,255,.08)
      }
      .nav-list.is-open{display:flex}
    }

<!-- Hero (Hard-Override, unabhängig von style.css) -->
<div
  role="img"
  aria-label="Resonanzraum Headerbild"
  style="
    width:100%;
    max-width:1100px;
    margin:16px auto;
    border-radius:12px;
    background:#0b0f12 url('/images/integrale-lebenspr.png') center center / cover no-repeat;
    aspect-ratio:21/7;
    display:block;
    overflow:visible;
    outline:2px solid #ffc94d; /* Debug: sichtbarer Rahmen, später entfernen */
  ">
</div>
  </style>
</head>

<body class="resonanzraum">
  <!-- Header -->
  <header class="site-header">
    <div class="nav-container">
      <a class="brand" href="../../index.html">Sinnwärts Studio</a>
      <button class="menu-toggle" aria-label="Menü öffnen" aria-expanded="false">☰</button>
      <nav aria-label="Hauptnavigation">
        <ul class="nav-list">
          <li><a href="../../index.html">Start</a></li>
          <li><a href="../../ueber-mich.html">Über mich</a></li>
          <li><a href="../../angebot.html">Angebote</a></li>
          <li><a class="active" aria-current="page" href="blog.html">Resonanzraum</a></li>
          <li><a href="../../kontakt.html">Kontakt</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <!-- Hero (stabil, ohne Cropping) -->
  <div class="blog-hero-stable" role="img" aria-label="Resonanzraum Headerbild"></div>

  <!-- Inhalt -->
  <main class="wrap">
    <div style="margin:.5rem 0 1rem">
      <a class="btn btn-gold" href="/resonanzraum.html"
         style="display:inline-flex;align-items:center;gap:.5rem">← Zurück zum Resonanzraum</a>
    </div>

    <section>
      <p id="status" class="meta" style="margin:.5rem 0 1rem">Lade Beiträge …</p>
      <div id="grid" class="grid"></div>
    </section>
  </main>

  <!-- JS -->
  <script>
    // Mobile-Menü
    (function(){
      const btn=document.querySelector('.menu-toggle');
      const list=document.querySelector('.nav-list');
      if(btn&&list){
        btn.addEventListener('click',()=>{
          const open=list.classList.toggle('is-open');
          btn.setAttribute('aria-expanded',open?'true':'false');
        });
      }
    })();

    // Blogposts laden
    (function(){
      const status=document.getElementById('status');
      const grid=document.getElementById('grid');
      const setStatus=m=>status.textContent=m;

      fetch('posts.json?v='+Date.now())
        .then(r=>{if(!r.ok)throw new Error('HTTP '+r.status);return r.json();})
        .then(posts=>{
          if(!Array.isArray(posts))throw new Error('Ungültiges JSON.');
          posts.sort((a,b)=>String(b.date).localeCompare(String(a.date)));
          grid.innerHTML=posts.map(p=>{
            const slug=p.slug||'';
            const title=p.title||'Ohne Titel';
            const date=p.date||'';
            const read=p.read||'';
            const teaser=p.teaser||'';
            return `
              <article class="card no-img">
                <a class="inner" href="${slug}.html">
                  <h3>${title}</h3>
                  <p class="meta">${date}${read?' · ca. '+read+' Min':''}</p>
                  <p class="teaser">${teaser}</p>
                </a>
              </article>`;
          }).join('');
          setStatus(posts.length+' Beiträge geladen.');
        })
        .catch(err=>{
          console.error(err);
          setStatus('Fehler beim Laden: '+err.message);
        });
    })();
  </script>
</body>
</html>
