
<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Resonanzraum – Blog-Archiv | Sinnwärts Studio</title>
  <link rel="stylesheet" href="../style.css">
  <style>
    .wrap{max-width:1100px;margin:32px auto;padding:0 16px}
    .grid{display:grid;gap:24px;grid-template-columns:repeat(auto-fill,minmax(280px,1fr))}
    .card{background:#0B0F12;border:1px solid #222;border-radius:14px;overflow:hidden}
    .card img{width:100%;aspect-ratio:16/9;object-fit:cover}
    .card .inner{padding:14px 16px}
    .meta{font-size:.9rem;opacity:.8}
  </style>
</head>
<body class="resonanzraum">
<header class="site-header"><a class="brand" href="../index.html">Sinnwärts Studio</a></header>

<main class="wrap">
  <h1>Resonanzraum</h1>
  <p class="sub">Weniger Rauschen. Mehr Richtung.</p>

  <div id="grid" class="grid" aria-live="polite"></div>
  <p id="status" class="meta" role="status" style="margin-top:16px;"></p>
</main>

<script>
  const DATA_URL = 'posts.json?v=' + Date.now();

  fetch(DATA_URL)
    .then(r => { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
    .then(posts => {
      const grid = document.querySelector('#grid');
      const html = posts
        .sort((a,b) => b.date.localeCompare(a.date))
        .map(p => `
          <article class="card">
            <a class="inner" href="${p.slug}.html">
              <img src="${p.img}" alt="${p.title}" loading="lazy">
              <h3>${p.title}</h3>
              <p class="meta">${p.date} · ca. ${p.read} Min</p>
              <p class="teaser">${p.teaser || ''}</p>
            </a>
          </article>
        `)
        .join('');
      grid.innerHTML = html || '<p class="meta">Noch keine Beiträge.</p>';
      document.getElementById('status')?.textContent = `${posts.length} Beiträge geladen.`;
    })
    .catch(err => {
      console.error('Blog fetch error:', err);
      document.getElementById('status')?.textContent = 'Fehler beim Laden der Beiträge.';
    });
</script>
</body>
</html>
