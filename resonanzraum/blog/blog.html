<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Resonanzraum – Blog-Archiv | Sinnwärts Studio</title>

  <!-- Basis-Styles (Repo-Root) -->
  <link rel="stylesheet" href="../../style.css">

  <!-- Lokale Ergänzungen (keine Doppelungen) -->
  <style>
    /* Layout */
    .wrap{max-width:1100px;margin:0 auto;padding:0 16px}

    /* Hero: komplettes Bild, kein Cropping */
    .resonanzraum .blog-hero{
      max-width:1100px;
      margin:clamp(12px,3vw,24px) auto;
      border-radius:12px;
      overflow:hidden;
      background:#0b0f12;
      line-height:0;
    }
    .resonanzraum .blog-hero img{
      display:block;
      width:100% !important;
      height:auto !important;
      object-fit:unset !important;
      object-position:unset !important;
      aspect-ratio:auto !important;
      border-radius:12px;
    }

    /* Cards/Grid */
    .grid{display:grid;gap:24px;grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}
    .card{border-radius:16px;background:#14181c;border:1px solid rgba(255,255,255,.06)}
    .card.no-img .inner{display:block;padding:18px 18px 20px}
    .card img{display:block;width:100%;height:auto;border-radius:16px 16px 0 0}
    .card h3{margin:12px 0 6px}
    .meta{opacity:.7}

    /* Header-Navigation */
    .site-header{position:sticky;top:0;background:#0b0f12;color:#fff;z-index:1000}
    .nav-container{max-width:1100px;margin:0 auto;display:flex;align-items:center;gap:16px;padding:10px 16px}
    .brand{color:#ffc94d;text-decoration:none;font-weight:600}
    .nav-list{list-style:none;display:flex;gap:16px;margin:0;padding:0}
    .nav-list a{color:#fff;text-decoration:none;opacity:.9}
    .nav-list a:hover,.nav-list a.active{opacity:1;text-underline-offset:4px;text-decoration:underline}
    .menu-toggle{display:none;background:none;border:0;color:#fff;font-size:1.4rem;line-height:1}

    @media (max-width:800px){
      .menu-toggle{display:block;margin-left:auto}
      nav[aria-label="Hauptnavigation"]{position:relative}
      .nav-list{
        display:none;flex-direction:column;gap:12px;background:#0b0f12;
        position:absolute;left:0;right:0;top:42px;padding:12px 16px;
        border-bottom:1px solid rgba(255,255,255,.08)
      }
      .nav-list.is-open{display:flex}
    }
  </style>
</head>

<body class="resonanzraum">
  <!-- Header + Navigation -->
  <header class="site-header">
    <div class="nav-container">
      <a class="brand" href="../../index.html">Sinnwärts Studio</a>
      <button class="menu-toggle" aria-label="Menü öffnen" aria-expanded="false">☰</button>
      <nav aria-label="Hauptnavigation">
        <ul class="nav-list">
          <li><a href="../../index.html">Start</a></li>
          <li><a href="../../ueber-mich.html">Über mich</a></li>
          <li><a href="../../angebot.html">Angebote</a></li>
          <li><a class="active" aria-current="page" href="../../resonanzraum.html">Resonanzraum</a></li>
          <li><a href="../../kontakt.html">Kontakt</a></li>
        </ul>
      </nav>
    </div>
  </header>

<!-- HERO: unbeschnitten, ganze Höhe -->
<header class="blog-hero" role="banner" aria-label="Headerbild Resonanzraum"
        style="max-width:1100px;margin:16px auto;border-radius:12px;overflow:visible;">
  <img id="hero-img"
       src="../../images/integrale-lebenspr.jpg"
       alt="Integrale Lebenspraxis – Figur auf farbiger Fläche, Kontinuum, Do your best"
       style="display:block;width:100%;height:auto;max-width:100%;border-radius:12px;">
</header>
  <!-- Inhalt -->
  <main class="wrap">
    <h1>Resonanzraum</h1>
    <p class="sub">Weniger Rauschen. Mehr Richtung.</p>

    <div id="grid" class="grid" aria-live="polite"></div>
    <p id="status" class="meta" role="status" style="margin-top:16px;"></p>
  </main>

  <!-- JS -->
  <script>
    // Mobile-Menü
    (function(){
      const btn = document.querySelector('.menu-toggle');
      const list = document.querySelector('.nav-list');
      if(btn && list){
        btn.addEventListener('click', () => {
          const open = list.classList.toggle('is-open');
          btn.setAttribute('aria-expanded', open ? 'true' : 'false');
        });
      }
    })();

    // Posts laden
    (function(){
      const statusEl = document.getElementById('status');
      const gridEl = document.getElementById('grid');
      const setStatus = (m)=>{ if(statusEl) statusEl.textContent=m; };

      fetch('posts.json?v=' + Date.now())
        .then(r => { if(!r.ok) throw new Error('HTTP '+r.status); return r.json(); })
        .then(posts => {
          if(!Array.isArray(posts)) throw new Error('Ungültiges JSON (Array erwartet).');
          posts.sort((a,b)=> String(b.date).localeCompare(String(a.date)));

          const html = posts.map(p=>{
            const slug=String(p.slug||'').trim();
            const title=String(p.title||'Ohne Titel');
            const date=String(p.date||'');
            const read=String(p.read||'');
            const teaser=String(p.teaser||'');
            const img=String(p.img||'');
            const cls='card'+(img?'':' no-img');

            return (
              '<article class="'+cls+'">'+
                '<a class="inner" href="'+slug+'.html">'+
                  (img?'<img src="'+img+'" alt="'+title.replace(/"/g,'&quot;')+'" loading="lazy">':'')+
                  '<h3>'+title+'</h3>'+
                  '<p class="meta">'+(date?date+' · ':'')+(read?('ca. '+read+' Min'):'')+'</p>'+
                  (teaser?'<p class="teaser">'+teaser+'</p>':'')+
                '</a>'+
              '</article>'
            );
          }).join('');

          gridEl.innerHTML = html || '<p class="meta">Noch keine Beiträge.</p>';
          setStatus(posts.length+' Beitrag'+(posts.length===1?'':'e')+' geladen.');
        })
        .catch(err=>{
          console.error('Blog fetch error:', err);
          setStatus('Fehler beim Laden: '+err.message);
        });
    })();
  </script>
</body>
</html>
